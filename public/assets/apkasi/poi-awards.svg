<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="Putri Otonomi Indonesia 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a1d"/>
      <stop offset="0.5" stop-color="#223d2c"/>
      <stop offset="1" stop-color="#16241a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07D"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#b8911f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="900" fill="url(#bg)"/>
  <rect width="720" height="900" fill="url(#glow)"/>

  <!-- Decorative concentric rings -->
  <g fill="none" stroke="#D4AF37" stroke-opacity="0.10">
    <circle cx="360" cy="300" r="180"/>
    <circle cx="360" cy="300" r="230"/>
    <circle cx="360" cy="300" r="280"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFE07D" opacity="0.8">
    <path d="M150 180 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M575 220 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.7"/>
    <path d="M120 470 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" opacity="0.6"/>
    <path d="M600 470 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.65"/>
  </g>

  <!-- Crown -->
  <g>
    <path d="M250 360 L250 280 L305 322 L360 250 L415 322 L470 280 L470 360 Z"
          fill="url(#gold)" stroke="#8f6f15" stroke-width="2" stroke-linejoin="round"/>
    <rect x="244" y="362" width="232" height="40" rx="10" fill="url(#gold)" stroke="#8f6f15" stroke-width="2"/>
    <!-- crown gems -->
    <circle cx="250" cy="280" r="11" fill="#FFE07D" stroke="#8f6f15" stroke-width="2"/>
    <circle cx="360" cy="250" r="13" fill="#FFE07D" stroke="#8f6f15" stroke-width="2"/>
    <circle cx="470" cy="280" r="11" fill="#FFE07D" stroke="#8f6f15" stroke-width="2"/>
    <circle cx="300" cy="382" r="6" fill="#16241a" opacity="0.55"/>
    <circle cx="360" cy="382" r="6" fill="#16241a" opacity="0.55"/>
    <circle cx="420" cy="382" r="6" fill="#16241a" opacity="0.55"/>
  </g>

  <!-- Text -->
  <text x="360" y="492" text-anchor="middle" fill="#FFE07D"
        font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700"
        letter-spacing="9">GRAND FINAL</text>

  <text x="360" y="572" text-anchor="middle" fill="#fdfcf8"
        font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Putri Otonomi</text>

  <text x="360" y="640" text-anchor="middle" fill="url(#gold)"
        font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700"
        letter-spacing="6">INDONESIA</text>

  <line x1="290" y1="678" x2="430" y2="678" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="360" cy="678" r="5" fill="#D4AF37"/>

  <text x="360" y="738" text-anchor="middle" fill="#fdfcf8"
        font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700"
        letter-spacing="14">2026</text>

  <text x="360" y="784" text-anchor="middle" fill="#85AB8B"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600"
        letter-spacing="3">Duta Otonomi Daerah Indonesia</text>

  <!-- bottom border accent -->
  <rect x="0" y="888" width="720" height="12" fill="url(#gold)"/>
</svg>

version: "3.9"

services:
  apkasi_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apkasi_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - apkasi_net

  apkasi_nginx:
    image: nginx:alpine
    container_name: apkasi_nginx
    restart: unless-stopped
    ports:
      - "8279:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - apkasi_app
    networks:
      - apkasi_net

networks:
  apkasi_net:
    driver: bridge

<!-- DEMO splash loader APKASI 2026. Logo pakai base64 (versi transparan). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --gold:#e1b23c;
    --cream:#f5f2eb;
    --grad:radial-gradient(120% 110% at 50% 22%, #1a4a2e 0%, #0b2014 52%, #06120b 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Plus Jakarta Sans",sans-serif;background:#06120b;overflow:hidden}

  /* ====== MOCK HALAMAN HOME (yang keliatan setelah burst) ====== */
  .page{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff;
    background:
      radial-gradient(100% 80% at 80% 5%, rgba(120,165,110,.5), transparent 55%),
      linear-gradient(180deg,#3f5e3a,#1c3322 70%,#122318);
    transform:scale(1.04); opacity:0; transition:opacity .7s ease, transform 1s ease;
  }
  .page.show{opacity:1; transform:none}
  .page h1{font-size:clamp(30px,6vw,64px);font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.4)}
  .page p{margin-top:12px;opacity:.85}

  /* ====== OVERLAY LOADER ====== */
  .loader{position:fixed; inset:0; z-index:50}

  /* lapisan kotak-kotak (tile) = backdrop gradient yang sambung */
  .tiles{position:absolute; inset:0; display:grid; z-index:1}
  .tile{
    background-image:var(--grad);
    background-size:100vw 100vh;
    background-repeat:no-repeat;
    will-change:transform,opacity;
  }
  .burst .tile{
    transition:transform .55s cubic-bezier(.6,.02,.5,1), opacity .55s ease;
    transition-delay:calc(var(--d) * .42s);
    transform:scale(.12) rotate(var(--r));
    opacity:0;
  }

  /* lapisan konten splash (logo, teks, progress) di atas tiles */
  .stage{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px;
    transition:opacity .35s ease, transform .5s ease;
  }
  .burst .stage{opacity:0; transform:scale(1.06)}

  /* glow ambient di belakang logo */
  .glow{position:absolute; width:680px; height:680px; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(225,178,60,.0), rgba(225,178,60,.16), rgba(120,200,140,.10), rgba(225,178,60,0));
    filter:blur(30px); animation:spin 18s linear infinite; z-index:-1; opacity:0; animation-play-state:paused}
  .go .glow{opacity:1; transition:opacity 1.2s ease .2s; animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}

  .cluster{display:flex; align-items:center; gap:clamp(16px,3vw,40px); animation:bob 6s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(5px)}to{transform:translateY(-7px)}}

  .crest{height:clamp(82px,12vw,124px); width:auto; opacity:0; transform:translateY(18px) scale(.8)}
  .sep{width:1px; height:clamp(60px,9vw,92px); background:linear-gradient(transparent,rgba(255,255,255,.45),transparent); opacity:0}
  .hut{position:relative; height:clamp(92px,13vw,140px); width:auto; opacity:0; transform:translateY(18px) scale(.85)}

  .go .crest{animation:pop .9s .15s cubic-bezier(.2,.8,.2,1) forwards}
  .go .sep{animation:fade .8s .35s ease forwards}
  .go .hut{animation:pop .95s .3s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes pop{to{opacity:1; transform:none}}
  @keyframes fade{to{opacity:.8}}

  /* shine sweep di logo HUT26 */
  .hut-wrap{position:relative; overflow:hidden; border-radius:8px}
  .hut-wrap::after{content:""; position:absolute; inset:0;
    background:linear-gradient(105deg,transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform:translateX(-130%); }
  .go .hut-wrap::after{animation:shine 1.4s 1.05s ease-out}
  @keyframes shine{to{transform:translateX(130%)}}

  .title{color:#fff; text-align:center; opacity:0; transform:translateY(16px)}
  .title .main{font-weight:700; font-size:clamp(15px,2.3vw,20px); letter-spacing:.01em}
  .title .date{margin-top:6px; font-weight:600; font-size:clamp(12px,1.7vw,15px); color:var(--gold); letter-spacing:.04em}
  .go .title{animation:up 1s .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes up{to{opacity:1; transform:none}}

  .presenters{display:flex; align-items:center; gap:18px; opacity:0; transform:translateY(14px)}
  .presenters .lbl{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.5); font-weight:600}
  .presenters img{height:34px; width:auto}
  .chip{background:var(--cream); padding:7px 12px; border-radius:10px; display:flex; align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .chip img{height:26px}
  .go .presenters{animation:up 1s .65s cubic-bezier(.2,.8,.2,1) forwards}

  /* progress */
  .progress{width:min(280px,70vw); opacity:0}
  .go .progress{animation:up .8s .55s ease forwards}
  .bar{height:3px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden}
  .bar i{display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#7fc88a,var(--gold)); transition:width .25s ease}
  .pmeta{display:flex; justify-content:space-between; margin-top:9px;
    font-size:11px; color:rgba(255,255,255,.55); font-weight:600; letter-spacing:.05em}

  /* partikel emas tipis */
  .dust{position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none}
  .dust span{position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:rgba(225,178,60,.7); animation:rise-dust linear infinite; opacity:0}
  @keyframes rise-dust{
    0%{transform:translateY(0); opacity:0}
    10%{opacity:.8} 90%{opacity:.5}
    100%{transform:translateY(-105vh); opacity:0}
  }

  /* kontrol demo (hapus di produksi) */
  .ctrl{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:99;
    display:flex; gap:10px}
  .ctrl button{font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; border:0;
    padding:10px 16px; border-radius:99px}
  .ctrl .a{background:var(--gold); color:#3a2c08}
  .ctrl .b{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.25)}

  @media(prefers-reduced-motion:reduce){
    .cluster,.glow,.dust span{animation:none!important}
  }
</style>

</div>

    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="pmeta"><span>Memuat pengalaman</span><span id="pct">0%</span></div>
    </div>
  </div>
</div>

<div class="ctrl">
  <button class="a" id="replay">&#8635; Putar ulang</button>
  <button class="b" id="skip">Selesaikan loading sekarang</button>
</div>

<script>
  var COLS=8, ROWS=5;
  var loader=document.getElementById('loader');
  var stage=document.getElementById('stage');
  var tilesEl=document.getElementById('tiles');
  var page=document.getElementById('page');
  var bar=document.getElementById('bar');
  var pct=document.getElementById('pct');

  function buildTiles(){
    tilesEl.innerHTML='';
    tilesEl.style.gridTemplateColumns='repeat('+COLS+',1fr)';
    tilesEl.style.gridTemplateRows='repeat('+ROWS+',1fr)';
    var cx=(COLS-1)/2, cy=(ROWS-1)/2;
    var maxd=Math.hypot(cx,cy);
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var t=document.createElement('div');
        t.className='tile';
        // posisi background biar gradient nyambung antar tile
        t.style.backgroundPosition=(-c*100/COLS)+'vw '+(-r*100/ROWS)+'vh';
        t.style.backgroundSize=(COLS*100/COLS)+'vw '+(ROWS*100/ROWS)+'vh';
        t.style.backgroundSize='100vw 100vh';
        t.style.backgroundPosition='left '+(c*100/(COLS-1))+'% top '+(r*100/(ROWS-1))+'%';
        // jarak dari pusat -> delay burst (radial)
        var d=Math.hypot(c-cx,r-cy)/maxd;
        var jitter=Math.random()*0.12;
        t.style.setProperty('--d',(d+jitter).toFixed(3));
        t.style.setProperty('--r',((Math.random()*40-20)).toFixed(1)+'deg');
        tilesEl.appendChild(t);
      }
    }
  }

  function buildDust(){
    var d=document.getElementById('dust'); d.innerHTML='';
    for(var i=0;i<22;i++){
      var s=document.createElement('span');
      s.style.left=(Math.random()*100)+'%';
      s.style.animationDuration=(6+Math.random()*7)+'s';
      s.style.animationDelay=(Math.random()*6)+'s';
      var sz=(2+Math.random()*3).toFixed(1);
      s.style.width=sz+'px'; s.style.height=sz+'px';
      d.appendChild(s);
    }
  }

  var progTimer, done=false;
  function start(){
    done=false;
    loader.classList.remove('burst');
    loader.style.display='block';
    page.classList.remove('show');
    buildTiles(); buildDust();
    // restart animasi masuk
    loader.classList.remove('go'); void loader.offsetWidth; loader.classList.add('go');
    // progress (durasi minimal ~2.2s). Di produksi bisa diikat ke load asli.
    var p=0; bar.style.width='0%'; pct.textContent='0%';
    clearInterval(progTimer);
    var startT=performance.now(), MIN=2200;
    progTimer=setInterval(function(){
      var el=performance.now()-startT;
      p=Math.min(100, Math.round((el/MIN)*100));
      // sedikit organik: melambat di akhir
      bar.style.width=p+'%'; pct.textContent=p+'%';
      if(p>=100){ clearInterval(progTimer); finish(); }
    },60);
  }

  function finish(){
    if(done) return; done=true;
    bar.style.width='100%'; pct.textContent='100%';
    page.classList.add('show');          // halaman mulai muncul di belakang
    setTimeout(function(){ loader.classList.add('burst'); }, 180); // logo fade, lalu tile burst
    setTimeout(function(){ loader.style.display='none'; }, 180+650);
  }

  document.getElementById('replay').onclick=start;
  document.getElementById('skip').onclick=function(){ clearInterval(progTimer); finish(); };

  start();
  window.addEventListener('resize', function(){ if(!loader.classList.contains('burst')) buildTiles(); });
</script>

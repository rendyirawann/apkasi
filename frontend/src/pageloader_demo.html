<!-- DEMO page loader ringkas untuk halaman dalam (agenda, wisata, hotel, rental). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Plus Jakarta Sans",sans-serif;background:#06120b;overflow:hidden}

  /* halaman target (mock) */
  .page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    color:#143524;background:#f5f2eb}
  .page h2{font-size:clamp(22px,4vw,40px);font-weight:800}

  /* ===== PAGE LOADER ===== */
  .ploader{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 110% at 50% 35%,#1a4a2e,#0b2014 60%,#06120b);
    opacity:0;transition:opacity .3s ease}
  .ploader.in{opacity:1}
  .ploader.out{opacity:0}

  .badge{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;
    transform:scale(.85);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
  .ploader.in .badge{transform:none;opacity:1}

  /* ring emas muter */
  .ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 60%,#e1b23c 80%,#7fc88a 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    animation:pl-spin 1s linear infinite}
  @keyframes pl-spin{to{transform:rotate(360deg)}}

  .badge img{width:62px;height:auto;animation:pl-pulse 1.6s ease-in-out infinite}
  @keyframes pl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .lbl{position:absolute;top:calc(50% + 78px);left:0;right:0;text-align:center;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}

  @media(prefers-reduced-motion:reduce){.ring,.badge img{animation:none}}

  .ctrl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99}
  .ctrl button{font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;border:0;
    padding:10px 18px;border-radius:99px;background:#e1b23c;color:#3a2c08}
</style>

<div class="page"><h2>Halaman Agenda</h2></div>

<script>
  var pl=document.getElementById('pl');

    pl.style.display='flex';
    pl.classList.remove('out');

  document.getElementById('go').onclick=run;
  run();
